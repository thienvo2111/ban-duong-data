name: Cập nhật dữ liệu

on:
  schedule:
    - cron: '17 19 * * 0' # 02:17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Một truy vấn Overpass, script tự thử lại đúng một lần. Máy chủ chính lỗi lâu thì đặt biến repo OVERPASS_URL.
      - name: Lấy dữ liệu OSM
        env:
          OVERPASS_URL: ${{ vars.OVERPASS_URL || 'https://overpass-api.de/api/interpreter' }}
        run: npm run data

      - name: Nén, kiểm tra, viết manifest
        id: build
        run: npm run release

      - name: Phát hành GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --latest --title "Dữ liệu $VERSION" \
              --notes "Dữ liệu Điểm ngày $VERSION. © OpenStreetMap contributors, giấy phép ODbL 1.0."
          fi

      # Commit manifest để repo luôn có hoạt động (GitHub tắt lịch chạy sau 60 ngày không hoạt động).
      - name: Ghi manifest vào repo
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || { git commit -m "Dữ liệu $VERSION"; git push; }
